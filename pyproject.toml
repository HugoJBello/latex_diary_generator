[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latex-diary-generator"
version = "0.1.0"
description = "LaTeX diary and booklet generator."
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.9",
    "PyMuPDF>=1.26",
]

[project.scripts]
generate-diary = "generate_diary:main"
create-booklet = "booklets:main"

[tool.setuptools]
py-modules = ["generate_diary", "booklets", "lunar_phase"]
